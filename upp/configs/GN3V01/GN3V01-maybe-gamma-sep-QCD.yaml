lowpt: &lowpt
  name: lowpt
  cuts:
    - [pt_btagJes, ">", 10_000]
    - [pt_btagJes, "<", 250_000]
highpt: &highpt
  name: highpt
  cuts:
    - [pt_btagJes, ">", 250_000]
    - [pt_btagJes, "<", 6_000_000]

components:
